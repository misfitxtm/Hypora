# MAC address randomization. Installed to /etc/NetworkManager/conf.d/hypora-mac.conf.
#
# A network card's permanent MAC address is a unique serial number it shouts, unencrypted,
# at every network it touches. Left alone it is a tracking identifier: the same laptop is
# recognisable across every cafe, airport and shop it passes, by anyone listening, with no
# cookie to clear and no setting in the browser that helps.
#
# Two separate things are randomized here.
#
# scan-rand-mac-address covers *scanning* — the probe requests a Wi-Fi card broadcasts
# while looking for networks, which it sends constantly whether or not you ever connect.
# This is the leak that follows you around a building. NetworkManager already defaults it
# to yes; it's set here so a future change of that default doesn't quietly turn it off.
#
# cloned-mac-address covers the address used once *connected*. The value is `stable`, not
# `random`: one address per connection profile, the same every time you join that network,
# different for every other network. That defeats cross-network tracking while leaving the
# things a changing MAC breaks — DHCP reservations, captive portal sessions, router rules
# keyed to a device — working, because each network still sees one consistent address.
#
#     random        a new address on every connect. Strongest, and breaks the above.
#     permanent     the card's real address, as it was before this file.
#
# The address does change once, when this file takes effect, so an existing DHCP
# reservation needs updating. To exempt one network and keep its real address:
#
#     nmcli connection modify "<name>" wifi.cloned-mac-address permanent
#     nmcli connection modify "<name>" ethernet.cloned-mac-address permanent
#
# `nmcli -f GENERAL.HWADDR,GENERAL.PERM-HWADDR device show <iface>` shows both addresses;
# when they differ, this is working. Menu > Security reports the same thing.
[device-mac-randomization]
wifi.scan-rand-mac-address=yes

[connection-mac-randomization]
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
