# MAC address randomization. Installed to /etc/NetworkManager/conf.d/hypora-mac.conf.
#
# A network card's permanent MAC address is a unique serial number that is sent unencrypted
# to every network it touches. Anyone listening can use it to recognise the same laptop in
# every cafe and airport.
#
# scan-rand-mac-address: random address while scanning for networks (the probe requests a
# card sends constantly). NetworkManager already defaults to yes; it is set here so a
# future change of the default does not turn it off.
#
# cloned-mac-address: the address used once connected. `stable` gives one address per
# connection profile: the same each time you join that network, different on every other
# network. That stops tracking across networks, and DHCP reservations and captive portals
# keep working. The alternatives:
#     random      a new address on every connect (strongest, but breaks the above)
#     permanent   the card's real address
#
# The address changes once when this file takes effect, so update any DHCP reservation.
# To keep the real address on one network:
#     nmcli connection modify "<name>" wifi.cloned-mac-address permanent
#     nmcli connection modify "<name>" ethernet.cloned-mac-address permanent
#
# `nmcli -f GENERAL.HWADDR,GENERAL.PERM-HWADDR device show <iface>` shows both addresses.
# If they differ, this is working. Menu > Security shows the same.
[device-mac-randomization]
wifi.scan-rand-mac-address=yes

[connection-mac-randomization]
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
