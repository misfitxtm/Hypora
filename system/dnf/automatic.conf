# Automatic security updates. Installed to /etc/dnf/automatic.conf.
#
# dnf5 reads its defaults from /usr/share/dnf5/dnf5-plugins/automatic.conf and then this
# file on top, so only overrides belong here. The schedule is in the systemd timer
# (dnf5-automatic.timer: daily at 06:00 with up to an hour of random delay), not here.
#
# upgrade_type = security installs only packages that have a Fedora security advisory:
#   - The Hyprland COPR is excluded. Third-party repos publish no advisory data, so the
#     compositor never updates while you use it. Update it yourself: sudo dnf upgrade
#   - Fixes that Fedora ships as a bugfix update instead of a security update are also
#     skipped. This narrows the window on the worst holes; it does not replace updating.
#
# Flatpaks (including Firefox) are not covered by dnf. hypora-flatpak-update.timer does them.
#
# reboot = never: a desktop should not restart itself. `dnf5 needs-restarting -r` says
# when a reboot is due.
#
# Results are in the journal: `journalctl -u dnf5-automatic`. To preview without waiting:
# `sudo dnf5 automatic --no-installupdates`.
[commands]
apply_updates = yes
download_updates = yes
upgrade_type = security
reboot = never
