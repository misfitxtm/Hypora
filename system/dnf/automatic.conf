# Automatic security updates. Installed to /etc/dnf/automatic.conf.
#
# dnf5 reads its defaults from /usr/share/dnf5/dnf5-plugins/automatic.conf and then applies
# this file on top, so only the overrides belong here. The schedule lives in the systemd
# unit (dnf5-automatic.timer: daily at 06:00, up to an hour of jitter, and it catches up on
# a missed run), not in this file.
#
# upgrade_type = security limits unattended installs to packages carrying a Fedora security
# advisory. Two consequences worth knowing:
#
#   - It deliberately excludes the Hyprland COPR. Third-party repositories publish no
#     advisory metadata, so nothing from them can match, which means the compositor this
#     desktop depends on never updates while you're using it. COPR updates stay a decision
#     you make by running `sudo dnf upgrade` yourself.
#   - It also excludes real fixes that Fedora shipped as a bugfix or enhancement update
#     rather than a security one, which happens often enough to matter. This narrows the
#     window on the worst holes; it is not a substitute for updating.
#
# Flatpak apps — including Firefox, where most of the risk actually lives — are not covered
# by dnf at all. hypora-flatpak-update.timer handles those.
#
# reboot = never, because a desktop deciding on its own to restart is worse than a kernel
# that waits. `dnf5 needs-restarting -r` says when a reboot is due.
#
# Results go to the journal: `journalctl -u dnf5-automatic`. To see what it would do without
# waiting for the timer: `sudo dnf5 automatic --no-installupdates`.
[commands]
apply_updates = yes
download_updates = yes
upgrade_type = security
reboot = never
