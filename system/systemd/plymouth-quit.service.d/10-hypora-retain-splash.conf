# Keep the boot splash on screen when Plymouth exits.
# Installed to /etc/systemd/system/plymouth-quit.service.d/ by install.sh.
#
# Without this there is a visible gap between Plymouth releasing the display and SDDM
# painting its first frame. Plymouth draws into its own buffer, so whatever was in the
# framebuffer underneath is still there — and on a themed setup that is the GRUB menu,
# which reappears for a moment after the splash ends and before the login screen arrives.
#
# `--retain-splash` means "don't explicitly hide the boot splash on exit", so the splash's
# last frame stays put and SDDM paints over Hypora's own artwork instead of over GRUB's.
#
# The empty ExecStart= is required, not decoration: plymouth-quit.service is a oneshot
# with a single ExecStart, and systemd refuses a second one unless the list is cleared
# first. Without the blank line this unit fails to load at all.
#
# The trade is worth stating: if SDDM never starts, the splash stays on screen rather than
# dropping to a console, so a failed boot looks like a frozen splash. Ctrl+Alt+F3 still
# gets you a TTY, and `journalctl -b -u sddm` says what happened.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
