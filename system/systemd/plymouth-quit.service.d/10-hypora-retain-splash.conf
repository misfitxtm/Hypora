# Keep the boot splash on screen when Plymouth exits.
# Installed to /etc/systemd/system/plymouth-quit.service.d/ by install.sh.
#
# Without this, the GRUB menu (still in the framebuffer) can show briefly between the
# splash and the login screen. `--retain-splash` leaves the splash's last frame in place, so
# SDDM paints over it.
#
# The empty `ExecStart=` is required: plymouth-quit.service has one ExecStart, and systemd
# refuses a second until the first is cleared. Without it the unit fails to load.
#
# Trade-off: if SDDM never starts, the splash stays up and looks like a frozen boot.
# Ctrl+Alt+F3 still opens a TTY, and `journalctl -b -u sddm` shows what happened.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
