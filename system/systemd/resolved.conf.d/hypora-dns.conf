# Encrypted DNS. Installed to /etc/systemd/resolved.conf.d/hypora-dns.conf.
#
# Without this, every domain you visit goes to whatever resolver the network handed you,
# in the clear — your ISP, or the cafe router. These queries go to Quad9 over TLS instead.
#
# The #hostname after each address is not decoration: it is the name the certificate is
# checked against, and without it DNS-over-TLS cannot authenticate the resolver.
#
# Domains=~. routes *every* lookup through this resolver. Without it, systemd-resolved
# would keep using the DNS servers DHCP handed out for most queries, and this file would
# quietly do nothing.
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
Domains=~.
DNSOverTLS=yes
DNSSEC=allow-downgrade
Cache=yes
