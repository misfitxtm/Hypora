# DNS settings. Installed to /etc/systemd/resolved.conf.d/hypora-dns.conf.
#
# DNS follows the network: whatever resolver DHCP hands out is the one used, so a resolver
# you run yourself (a Pi-hole, a router, an internal DNS server) stays in charge and its
# filtering and local names keep working. Quad9 is only a fallback for networks that hand
# out no resolver at all.
#
# DNSOverTLS=opportunistic encrypts the connection to the resolver when it answers on port
# 853, and uses plain DNS when it doesn't — which is what a Pi-hole on port 53 needs. The
# trade is that a network can force plaintext simply by blocking 853, so this protects
# against someone passively watching, not against the network operator itself. `yes` is the
# strict version: it refuses to fall back, and refuses to talk to a plain-DNS resolver.
#
# The #hostname after each address is not decoration: it is the name the resolver's
# certificate is checked against, and without it DNS-over-TLS cannot authenticate anything.
#
# To send every lookup to one resolver regardless of what the network says — your Pi-hole
# at a static address, or Quad9 on untrusted Wi-Fi — set DNS= and Domains=~. here:
#
#     DNS=10.0.0.2
#     Domains=~.
#
# Domains=~. is the part that matters: without it, systemd-resolved keeps using the DHCP
# servers for most queries and a DNS= line does close to nothing. Leaving both unset (as
# below) is what lets the network's resolver win.
#
# Cache=yes is local caching. It makes repeat lookups instant, at the cost of hiding them
# from the resolver — a Pi-hole's dashboard will undercount. Set Cache=no to see them all.
#
# DNSSEC=allow-downgrade is a deliberate choice, and it is the weakest setting here, so it
# deserves saying out loud: it validates signatures when the resolver supports DNSSEC and
# silently stops when it doesn't — which means an attacker who can tamper with the path can
# also make it look unsupported and turn validation off. It is not a security boundary.
#
# It is the setting here because the alternatives are worse in practice. DNSSEC=yes breaks
# resolution outright on a resolver that doesn't do DNSSEC — most home routers, many
# Pi-hole setups, and a good share of captive portals and corporate networks — and a desktop
# that cannot resolve anything is not a more secure desktop, it is one you reinstall. Fedora
# itself ships no DNSSEC setting at all, which is weaker still.
#
# If your resolver does validate (Quad9 does, and unbound/BIND can), tighten it:
#
#     DNSSEC=yes
#
# and check it held with:  resolvectl query --validate=yes fedoraproject.org
[Resolve]
FallbackDNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
Cache=yes
