# DNS settings. Installed to /etc/systemd/resolved.conf.d/hypora-dns.conf.
#
# DNS follows the network: the resolver from DHCP is used, so a resolver you run yourself
# (Pi-hole, router, internal DNS) stays in charge. Quad9 is only a fallback for networks
# that hand out no resolver.
#
# DNSOverTLS=opportunistic encrypts the connection to the resolver when it answers on
# port 853, and uses plain DNS when it does not (a Pi-hole on port 53 needs that). A network
# can force plain DNS by blocking port 853, so this stops passive watching, not the network
# operator. `yes` is strict: it never falls back to plain DNS.
#
# The #hostname after each address is the name the resolver's certificate is checked
# against. Without it DNS-over-TLS cannot authenticate the server.
#
# To send all lookups to one resolver whatever the network says, set both of these here:
#     DNS=10.0.0.2
#     Domains=~.
# Domains=~. is required; without it systemd-resolved still uses the DHCP servers for most
# queries.
#
# Cache=yes caches lookups locally. Repeats are instant, but a Pi-hole dashboard will
# undercount. Use Cache=no to see every query.
#
# DNSSEC=allow-downgrade is the weakest setting here: it checks signatures when the
# resolver supports DNSSEC and stops when it does not, so an attacker on the path can make
# it look unsupported. It is not a security boundary. It is used because DNSSEC=yes breaks
# all lookups on resolvers without DNSSEC (many routers, Pi-holes and captive portals).
# If your resolver validates (Quad9 does), tighten it with DNSSEC=yes and check:
#     resolvectl query --validate=yes fedoraproject.org
[Resolve]
FallbackDNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
Cache=yes
