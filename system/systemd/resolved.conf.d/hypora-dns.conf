# DNS follows DHCP with Quad9 fallback and opportunistic DNS-over-TLS; DNSSEC=allow-downgrade is weak, use =yes if your resolver validates.
[Resolve]
FallbackDNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
Cache=yes
# LLMNR lets any host on the LAN answer a name lookup, so names can be spoofed on shared Wi-Fi.
LLMNR=no
