# Idle behaviour. Installed to ~/.config/hypr/hypridle.conf and started from hyprland.lua.
#
# Without this nothing locks the screen (hyprlock only runs on SUPER+L). The timings lock
# the screen before it goes dark, so the machine is never unlocked with a blank display.

general {
    # Don't stack lock screens if one is already up
    lock_cmd = pidof hyprlock || hyprlock
    # Lock before suspending, so waking needs the password
    before_sleep_cmd = loginctl lock-session
    # Some displays need a nudge to come back after sleep
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    # Respect apps that ask not to be interrupted (video players, Steam)
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 10 minutes: lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 minutes: turn the display off. It is already locked by now.
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
