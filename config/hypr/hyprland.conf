# Minimal Hyprland session used only to host the Quickshell greeter.
monitor = , preferred, auto, 1

exec-once = uwsm app -- qs
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}
animations {
    enabled = false
}
input {
    kb_layout = us
}
