# Hypora kitty config. Colors come from the active theme (see hypora-theme).
include current-theme.conf

font_family JetBrainsMono Nerd Font
font_size 11.0

window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
# Jump straight to the new position. A trail animation (cursor_trail 20, say) looks
# good on big jumps but drags on every Enter, which is tiring to read against.
cursor_trail 0
tab_bar_style powerline
