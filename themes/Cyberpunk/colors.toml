# Cyberpunk. No upstream palette, so this is built from its own wallpaper: a neon city
# canyon whose shadows sample to #242831/#313946 and whose signage runs cyan and
# magenta. The UI background sits below the wallpaper's darkest midtone so panels
# read as foreground against it rather than merging into it.
name = "Cyberpunk"
mode = "dark"

# UI
background = "#0f1219"
surface = "#1b2030"
foreground = "#d7e0ef"
dim = "#8593b3"
accent = "#22d3ee"
error = "#ff4d6d"
selection = "#243049"
muted = "#39445e"

# Terminal (ANSI)
term_foreground = "#c6d2e8"
black = "#0f1219"
red = "#ff4d6d"
green = "#4ade80"
yellow = "#f7b955"
blue = "#5aa9ff"
magenta = "#e879f9"
cyan = "#22d3ee"
white = "#b8c4d9"
bright_black = "#39445e"
bright_red = "#ff7a92"
bright_green = "#6ee7a0"
bright_yellow = "#ffd27f"
bright_blue = "#7fc3ff"
bright_magenta = "#f0a6ff"
bright_cyan = "#67e8f9"
bright_white = "#e8eefb"

# System
font = "JetBrainsMono Nerd Font"
gtk_theme = "adw-gtk3-dark"
icon_theme = "Gruvbox-Plus-Dark"
color_scheme = "prefer-dark"
