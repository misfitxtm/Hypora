# Catppuccin Mocha (github.com/catppuccin/catppuccin), MIT. Mauve accent, the Mocha default.
# One palette drives every app; see themes/templates/.
name = "CatppuccinMocha"
mode = "dark"

# UI
background = "#1e1e2e"
surface = "#313244"
foreground = "#cdd6f4"
dim = "#6c7086"
accent = "#cba6f7"
error = "#f38ba8"
selection = "#45475a"
muted = "#585b70"

# Terminal (ANSI)
term_foreground = "#cdd6f4"
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#cba6f7"
cyan = "#94e2d5"
white = "#bac2de"
bright_black = "#585b70"
bright_red = "#f38ba8"
bright_green = "#a6e3a1"
bright_yellow = "#f9e2af"
bright_blue = "#89b4fa"
bright_magenta = "#cba6f7"
bright_cyan = "#94e2d5"
bright_white = "#a6adc8"

# System
font = "JetBrainsMono Nerd Font"
gtk_theme = "adw-gtk3-dark"
icon_theme = "Papirus-Dark"
color_scheme = "prefer-dark"
