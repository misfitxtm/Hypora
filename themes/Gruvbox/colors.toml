# Gruvbox (github.com/morhetz/gruvbox). The canonical dark palette, not derived
# from the wallpaper — Gruvbox is a defined scheme and guessing at it would be worse.
name = "Gruvbox"
mode = "dark"

# UI
background = "#282828"
surface = "#3c3836"
foreground = "#ebdbb2"
dim = "#928374"
accent = "#fabd2f"
error = "#fb4934"
selection = "#504945"
muted = "#665c54"

# Terminal (ANSI)
term_foreground = "#ebdbb2"
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"
bright_black = "#928374"
bright_red = "#fb4934"
bright_green = "#b8bb26"
bright_yellow = "#fabd2f"
bright_blue = "#83a598"
bright_magenta = "#d3869b"
bright_cyan = "#8ec07c"
bright_white = "#ebdbb2"

# System
font = "JetBrainsMono Nerd Font"
gtk_theme = "adw-gtk3-dark"
icon_theme = "Gruvbox-Plus-Dark"
color_scheme = "prefer-dark"
